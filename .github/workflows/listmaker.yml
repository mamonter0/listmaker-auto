name: listmaker

on:
  schedule:
    # RED DE SEGURIDAD. El disparo principal es externo: cron-job.org llama a
    # la API (workflow_dispatch) a las 09:00 y a las 23:00 hora de Madrid,
    # puntual al minuto. Estos crons de GitHub solo se ejecutan si desde su
    # hora programada NO hubo un run lanzado a mano/externo (ver `gate`).
    #
    # Van 5 minutos DESPUES de cada disparo externo, a proposito: GitHub los
    # arranca con 2-7h de retraso, pero si algun dia fuera puntual tampoco
    # podrian adelantarse al externo y ejecutarse los dos.
    #
    # El cron va en UTC y no conoce el horario de verano, asi que hay una
    # variante por estacion y el job `gate` deja pasar solo la que toca.
    - cron: "5 7 * * *"    # 09:05 Madrid, verano   (CEST, UTC+2)
    - cron: "5 8 * * *"    # 09:05 Madrid, invierno (CET,  UTC+1)
    - cron: "5 21 * * *"   # 23:05 Madrid, verano
    - cron: "5 22 * * *"   # 23:05 Madrid, invierno
  workflow_dispatch:

jobs:
  # Decide si este disparo es el de la estacion correcta. Va por el cron que lo
  # lanzo (github.event.schedule), no por la hora actual: GitHub retrasa los
  # programados varias horas y la hora de arranque no es fiable.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read   # para consultar los runs recientes de este workflow
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SCHEDULE" ]; then
            echo "Lanzado a mano o por el disparo externo: se ejecuta."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=Europe/Madrid date +%z)   # +0200 en verano, +0100 en invierno
          case "$SCHEDULE" in
            "5 7 * * *"|"5 21 * * *") want="+0200" ;;
            "5 8 * * *"|"5 22 * * *") want="+0100" ;;
            *) want="$offset" ;;
          esac
          if [ "$offset" != "$want" ]; then
            echo "Cron '$SCHEDULE' es de la otra estacion (Madrid $offset): se salta."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Respaldo del disparo externo: si desde la hora a la que tocaba este
          # cron ya hubo un run lanzado por workflow_dispatch (en curso o
          # terminado bien), este cron retrasado sobra. Los fallidos no cuentan:
          # asi reintenta. Si la consulta falla, se ejecuta (mejor un run de
          # mas que uno de menos).
          #
          # La ventana se cuenta desde la hora PROGRAMADA del cron (menos 20
          # min de margen), no "N horas atras": GitHub llega a retrasarlo mas
          # de 8h, y con una ventana fija el disparo externo quedaba fuera y se
          # repetia el scrapeo entero sin necesidad.
          min=$(echo "$SCHEDULE" | cut -d' ' -f1); hour=$(echo "$SCHEDULE" | cut -d' ' -f2)
          slot=$(date -u -d "today $hour:$min" +%s)
          [ "$slot" -gt "$(date -u +%s)" ] && slot=$((slot - 86400))
          since=$(date -u -d "@$((slot - 1200))" +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api -X GET "repos/$REPO/actions/workflows/listmaker.yml/runs"                      -f event=workflow_dispatch -f created=">=$since" -f per_page=20                      --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length'                    ) || recent=0
          if [ "${recent:-0}" -gt 0 ]; then
            echo "Cron '$SCHEDULE': ya hubo $recent run(s) externo(s)/manual(es) desde $since. Se salta."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cron '$SCHEDULE' (Madrid $offset): no hubo disparo externo desde $since, se ejecuta como respaldo."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330  # ~5.5h, deja margen al límite de 6h del runner

    # Solo un run a la vez (compartido con recover/audit/backfill/rename).
    # Va a nivel de job y no de workflow: asi el disparo de la otra estacion,
    # que se descarta en segundos en `gate`, nunca entra en la cola ni puede
    # desplazar a un run lanzado a mano que este esperando.
    concurrency:
      group: listmaker
      cancel-in-progress: false

    env:
      # OAuth user credentials (preferidas — necesario para crear archivos en Drive personal)
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      # Service Account (fallback, opcional)
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      # URL del foro (no se hardcodea en el repo)
      FORUM_BASE_URL: ${{ secrets.FORUM_BASE_URL }}
      # Cookies del foro (pickled session, base64-encoded)
      FORUM_COOKIES_B64: ${{ secrets.FORUM_COOKIES_B64 }}
      ARTISTS_TXT_B64: ${{ secrets.ARTISTS_TXT_B64 }}
      ARTISTS_FOLDER_ID: ${{ secrets.ARTISTS_FOLDER_ID }}
      # El repo y sus logs son publicos: el detalle (autores, hilos, capitulos)
      # va a logs/run_log.txt y de ahi a Drive; aqui solo salen contadores.
      PRIVATE_LOG: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ubuntu-latest ya trae Google Chrome instalado.
      # Selenium 4.15+ usa Selenium Manager y descarga chromedriver solo.
      - name: Verify Chrome
        run: google-chrome --version

      - name: Download state from Drive
        id: download
        run: python scripts/download.py

      # Continue-on-error: aunque scrape falle (p.ej. rate-limit, exit 3), el entry point ya
      # ejecuta save_and_compare_history en el finally, así que deltas.jsonl/history.json
      # pueden tener cambios valiosos. Queremos que upload siga corriendo para persistirlos.
      - name: Scrape forum
        id: scrape
        continue-on-error: true
        run: python scripts/scrape.py

      - name: Generate PDFs
        if: steps.scrape.outcome == 'success'
        id: write
        continue-on-error: true
        run: python scripts/write.py

      # Solo subimos si download fue OK; si no, el estado local está vacío/corrupto
      # y subirlo borraría datos buenos en Drive.
      - name: Upload state to Drive
        if: steps.download.outcome == 'success'
        run: python scripts/upload.py

      # lists/ultimas_entradas.txt: los 7 ultimos capitulos de cada autor por
      # fecha, leidos de los nombres de los PDFs en Drive. No toca el foro.
      - name: Latest entries per author
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: python scripts/latest_entries.py

      # Si scrape o write fallaron, marca el job como failed (después del upload, para
      # que GH Actions mande el email automático al owner del repo).
      - name: Mark job failed if any stage failed
        if: steps.scrape.outcome == 'failure' || steps.write.outcome == 'failure'
        run: |
          echo "scrape outcome: ${{ steps.scrape.outcome }}"
          echo "write outcome: ${{ steps.write.outcome }}"
          exit 1

      # Sin artifacts: en un repo publico cualquiera puede descargarlos.
      # failed_artists.json y deltas.jsonl ya estan en Drive (lists/).
      - name: Save private log to Drive
        if: always()
        continue-on-error: true
        run: python scripts/save_log.py
